<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora.</title>
    <link rel="stylesheet" href="index2.css">
</head> 
<body>
    <div class="calculadora">
        <input type="text" class="pantalla" value="0" id="pantalla">
        <input type="button" class="operador" value="DEL" id="DEL">
        <input type="button" class="operador" value="CE" id="AC">
        <input type="button" class="operador" value="(" id="(">
        <input type="button" class="operador" value=")" id=")">
        <input type="button" class="operador" value="%" id="%">
        <input type="button" class="operador" value="^" id="^">
        <input type="button" class="tecla" value="6" id="6">
        <input type="button" class="tecla" value="7" id="7">
        <input type="button" class="tecla" value="8" id="8">
        <input type="button" class="tecla" value="9" id="9">
        <input type="button" class="operador" value="*" id="*">
        <input type="button" class="operador" value="/" id="/">
        <input type="button" class="tecla" value="2" id="2">
        <input type="button" class="tecla" value="3" id="3">
        <input type="button" class="tecla" value="4" id="4">
        <input type="button" class="tecla" value="5" id="5">
        <input type="button" class="operador" value="-" id="-">
        <input type="button" class="operador" value="+" id="+">
        <input type="button" class="tecla" value="1" Id="1">
        <input type="button" class="tecla" value="0" id="0">
        <input type="button" class="tecla" value="." id=".">
        <input type="button" class="operador" value="√" id="√">
        <input type="button" class="igual" value="=" id="=">
    </div>
    <script src="index2.js"></script> 

</body>
</html>
